#import "job_fragments.graphql"

interface ProbeNode {
  id: ID!
  owner: ProbeUser
}

type ProbeUser {
  id: ID!
  name: String!
}

input ProbeJobFilter {
  owner: ProbeUser
  status: String
}

type ProbeJob implements ProbeNode {
  id: ID!
  owner: ProbeUser
  result(input: ProbeJobFilter): ProbeJobResult
}

type ProbeJobResult {
  job: ProbeJob
  owner: ProbeUser
}
